[package]
name = "shepr"
version = "0.1.0"
edition = "2024"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
publish = false
repository = "https://github.com/folknor/shepr"
rust-version = "1.99"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]

# Terminal emulation core. Pinned exactly: crates/shepr-vt/src/ is written against this
# version's API (reference checkout in research/alacritty).
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "0.23.1"
bytes = "1"
# clap is the CLI parser (src/cli/spec.rs). error-context makes usage errors
# name the offending argument and value instead of only the error kind.
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
ctrlc = { version = "3", features = ["termination"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
# Also the PTY layer (crates/shepr-pty/src/backend.rs): openpty, session setup, pre-exec.
libc = "0.2"
# The client initializes Ratatui with Crossterm; other optional backends, the
# calendar widget, layout cache, macros and underline-color support are unused.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
time = { version = "0.3.47", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.1"
unicode-width = "0.2"
# logind's delay inhibitor lets the server save before host shutdown kills panes.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[workspace.lints.clippy]
# Style: modern idiomatic Rust
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"

# Safety: strict error handling
unwrap_in_result = "deny"
ok_expect = "deny"
unwrap_used = "deny"

# Async safety
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Type safety
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"

# Safety: no debug/placeholder code in production
dbg_macro = "deny"
todo = "deny"

# The environment seal: `clippy.toml` bans raw `std::env` reads and writes
# outside `shepr_core::env`, and escapes carry a scoped `#[expect]`.
disallowed_methods = "deny"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

shepr-agent = { path = "crates/shepr-agent" }
shepr-api = { path = "crates/shepr-api" }
shepr-client = { path = "crates/shepr-client" }
shepr-config = { path = "crates/shepr-config" }
shepr-core = { path = "crates/shepr-core" }
shepr-mux = { path = "crates/shepr-mux" }
shepr-platform = { path = "crates/shepr-platform" }
shepr-protocol = { path = "crates/shepr-protocol" }
shepr-remote = { path = "crates/shepr-remote" }
shepr-server = { path = "crates/shepr-server" }

[lints]
workspace = true

[dev-dependencies]
shepr-agent = { path = "crates/shepr-agent", features = ["test-support"] }
shepr-api = { path = "crates/shepr-api", features = ["test-support"] }
shepr-client = { path = "crates/shepr-client", features = ["test-support"] }
shepr-config = { path = "crates/shepr-config", features = ["test-support"] }
shepr-protocol = { path = "crates/shepr-protocol", features = ["test-support"] }
shepr-server = { path = "crates/shepr-server", features = ["test-api"] }
shepr-termio = { path = "crates/shepr-termio", features = ["test-support"] }
shepr-test-support = { path = "crates/shepr-test-support" }
tokio = { workspace = true }
toml = { workspace = true }
