[package]
name = "shepr"
version = "0.1.0"
edition = "2024"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
publish = false
# build.rs at the root is shared source, included by path from the build scripts
# of shepr-protocol and shepr-config; this package uses none of its output.
build = false
repository = "https://github.com/folknor/shepr"
rust-version = "1.99"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]

# Terminal emulation core. Pinned exactly: crates/shepr-vt/src/ is written against this
# version's API (read its source in the cargo registry, at
# ~/.cargo/registry/src/*/alacritty_terminal-<version>/).
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "0.23.1"
bytes = "1"
# clap is the CLI parser (src/cli/spec.rs). error-context makes usage errors
# name the offending argument and value instead of only the error kind.
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
# A wire cell's symbol (`shepr_protocol::CellData`): graphemes up to 24 bytes
# stay inline, so building, decoding and cloning a frame or patch cell does not
# allocate. Ratatui already links it for its own cells.
compact_str = { version = "0.10.0", features = ["serde"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
ctrlc = { version = "3", features = ["termination"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonc-parser = { version = "0.34.0", default-features = false, features = ["cst", "serde_json"] }
# Also the PTY layer (crates/shepr-pty/src/backend.rs): openpty, session setup, pre-exec.
libc = "0.2"
memchr = "2"
# `shepr man` renders the bundled docs to the terminal through the renderer
# in src/cli/man/render.rs. Neither needs a default feature:
# pulldown-cmark's are its HTML writer and command-line binary.
owo-colors = { version = "4", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
# The client initializes Ratatui with Crossterm; other optional backends, the
# calendar widget, layout cache, macros and underline-color support are unused.
# `unstable-rendered-line-info` provides `Paragraph::line_count`, so the help
# overlay's scroll range and the notice card's height count wrapped rows with
# the same word wrapper that draws them.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.1"
unicode-width = "0.2"
# `shepr-vt/src/handler.rs` implements this trait explicitly, so pin the API
# version that implementation is checked against.
vte = { version = "=0.15.0", default-features = false, features = ["ansi", "std"] }
# logind's delay inhibitor lets the server save before host shutdown kills panes.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

# Doc links and doc markup. Clippy and the test phases never run rustdoc, so
# these are evaluated by brokkr's `[rustdoc]` phase (`brokkr.toml`), which
# documents private items too.
[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
unescaped_backticks = "deny"
# The phase documents private items, so a public item's link to a private one
# resolves in the docs it produces.
private_intra_doc_links = "allow"

[workspace.lints.clippy]
# Style: modern idiomatic Rust
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"

# Safety: strict error handling
unwrap_in_result = "deny"
ok_expect = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"

# Async safety
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Type safety
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"

# Safety: no debug/placeholder code in production
dbg_macro = "deny"
todo = "deny"

# The seals: `clippy.toml` bans raw `std::env` reads and writes outside
# `shepr_core::env`, exits outside main, bool presence probes, ad hoc panic
# containment, children without a stated working directory and debug
# assertions. Escapes carry a scoped `#[expect]`.
disallowed_methods = "deny"
disallowed_macros = "deny"

# A suppression is an `#[expect(.., reason = ..)]`, which fires once it is no
# longer needed and carries its reason in the attribute.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
# The gate never builds release, by decision: `brokkr check` has no release
# sweep. This is what stands in for one, so a release binary still panics on
# overflow instead of silently wrapping like the default release profile.
overflow-checks = true

[dependencies]
clap = { workspace = true }
owo-colors = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

shepr-api = { path = "crates/shepr-api" }
shepr-client = { path = "crates/shepr-client" }
shepr-config = { path = "crates/shepr-config" }
shepr-core = { path = "crates/shepr-core" }
shepr-detect = { path = "crates/shepr-detect" }
shepr-launch = { path = "crates/shepr-launch" }
shepr-paths = { path = "crates/shepr-paths" }
shepr-platform = { path = "crates/shepr-platform" }
shepr-protocol = { path = "crates/shepr-protocol" }
shepr-remote = { path = "crates/shepr-remote" }

[lints]
workspace = true

[dev-dependencies]
shepr-test-fixtures = { path = "crates/shepr-test-fixtures" }
shepr-test-support = { path = "crates/shepr-test-support" }
tokio = { workspace = true }
toml = { workspace = true }
