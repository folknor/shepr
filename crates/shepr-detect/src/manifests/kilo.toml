id = "kilo"

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
visible_blocker = true
# Reuse OpenCode's exact permission gate tree. The compiled reference imports
# only its matcher body; this rule keeps Kilo's own identity and verdict.
rule = "opencode.permission_required"

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
region = "whole_recent"
contains = ["esc interrupt"]
