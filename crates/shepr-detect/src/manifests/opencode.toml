id = "opencode"

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
# This is the canonical permission gate tree; Kilo references this matcher
# body so the two agents keep identical screen matching.
# The header alone can linger in the transcript; require it AND one of the
# dialog's own reply controls. "Reject" (for a subagent's request) and "Allow
# always" lead to follow-up screens of the same pending request, which drop the
# "Permission required" header: the reject feedback prompt needs both of its
# key hints, the always-allow confirmation its Confirm / Cancel buttons on one
# line AND its confirm hint.
any = [
  { contains = ["△ Permission required"], any = [
    { contains = ["allow once"] },
    { contains = ["allow always"] },
    { contains = ["reject"] },
    { contains = ["enter confirm"] },
  ] },
  { contains = ["△ Reject permission"], all = [
    { contains = ["enter confirm"] },
    { contains = ["esc cancel"] },
  ] },
  { contains = ["△ Always allow"], all = [
    { line_regex = ['(?i)confirm\s+cancel'] },
    { contains = ["enter confirm"] },
  ] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
regex = ['(■|⬝){4,}']
