[package]
name = "shepr-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = { workspace = true }
ctrlc = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }

shepr-config = { path = "../shepr-config" }
shepr-core = { path = "../shepr-core" }
shepr-launch = { path = "../shepr-launch" }
shepr-paths = { path = "../shepr-paths" }
shepr-platform = { path = "../shepr-platform" }
shepr-protocol = { path = "../shepr-protocol" }
shepr-remote = { path = "../shepr-remote" }
shepr-surface = { path = "../shepr-surface" }
shepr-term = { path = "../shepr-term" }
shepr-termio = { path = "../shepr-termio" }

[dev-dependencies]
shepr-test-fixtures = { path = "../shepr-test-fixtures" }
shepr-test-support = { path = "../shepr-test-support" }
# The client loop's timer tests run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# Inline TOML fixtures are parsed by the codec and sidebar unit tests.
toml = { workspace = true }

[lints]
workspace = true
