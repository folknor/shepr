[package]
name = "shepr-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = { workspace = true }
crossterm = { workspace = true }
ctrlc = { workspace = true }
interprocess = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

shepr-agent = { path = "../shepr-agent" }
shepr-config = { path = "../shepr-config" }
shepr-core = { path = "../shepr-core" }
shepr-platform = { path = "../shepr-platform" }
shepr-protocol = { path = "../shepr-protocol" }
shepr-remote = { path = "../shepr-remote" }
shepr-termio = { path = "../shepr-termio" }
shepr-vt = { path = "../shepr-vt" }

[dev-dependencies]
shepr-test-fixtures = { path = "../shepr-test-fixtures" }
shepr-test-support = { path = "../shepr-test-support" }
# The client loop's timer tests run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# Inline TOML fixtures are parsed by the codec and sidebar unit tests.
toml = { workspace = true }

[lints]
workspace = true
