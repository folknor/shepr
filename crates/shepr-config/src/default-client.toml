# shepr client configuration
# Place this file at ~/.config/shepr/client.toml
# Only the shepr client reads this file, on the host it runs on. It decides
# keys, the sidebar, prompts, mouse and copy behaviour and the machines shown.
# Pane shells, sessions, and whether panes have borders belong in server.toml,
# which only shepr-server reads. An unknown or misplaced setting fails the
# launch.
#
# There is no colour theme. Every colour shepr draws, the pane borders and
# scrollbars each server draws included, is derived from the background,
# foreground and ANSI colours your terminal reports, so shepr matches whatever
# theme the terminal has. Until the terminal reports a background, and on one
# that never does, shepr uses the terminal's own ANSI colours. The accent is
# the local server's palette hue (see [[machines]] below).

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# A prefix that some default binding also uses ("esc" is navigate_back, "-" is
# split_horizontal's key) fails the launch until that binding is set explicitly.
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers ("meta" is an alias for alt),
# and special keys like enter/tab/esc/left/right/up/down/home/end/pageup/pagedown/delete/insert.
# Function key names range from f1 through f35.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# detach = "prefix+q"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "prefix+p"
# next_workspace = "prefix+n"
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# switch_workspace = "prefix+1..9"   # indexed: prefix+1 switches to workspace 1, and so on
# rename_pane = "prefix+shift+p"
# clear_pane = ""                  # unbound; e.g. "prefix+ctrl+k"
# copy_mode = "prefix+["
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# swap_pane_left = "prefix+shift+h"
# swap_pane_down = "prefix+shift+j"
# swap_pane_up = "prefix+shift+k"
# swap_pane_right = "prefix+shift+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"
# resize_mode = "prefix+r"
# resize_pane_left = ""   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
# resize_pane_down = ""   # optional, e.g. "ctrl+shift+alt+down"
# resize_pane_up = ""     # optional, e.g. "ctrl+shift+alt+up"
# resize_pane_right = ""  # optional, e.g. "ctrl+shift+alt+right"
# toggle_sidebar = "prefix+b"

# Navigate mode (entered with workspace_picker). These are its only keys: every
# other key, the prefix included, does nothing while it is open. They do not
# include prefix+. Up and down move one selection through the workspaces (a
# machine's Connect or Restart entry in place of its workspaces) and then the
# agents below them; enter opens a workspace, focuses an agent's pane, or
# chooses the entry; back leaves navigate mode.
# navigate_back = "esc"
# navigate_up = "up"
# navigate_down = "down"
# navigate_open = "enter"

[ui]
# Expanded sidebar width in columns. It must be between sidebar_min_width and
# sidebar_max_width.
# sidebar_width = 26
# While unset, mouse or key changes to sidebar width are remembered by the client.
# Once set, this value wins at every launch.

# Minimum sidebar width when expanded (columns). Dragging the sidebar edge
# below it collapses the sidebar; dragging back past it expands it again.
# sidebar_min_width = 18

# Maximum sidebar width when expanded (columns)
# sidebar_max_width = 36

# Start with the sidebar collapsed. Changes take effect on the next launch.
# sidebar_start_collapsed = false
# While unset, mouse or key changes to the collapsed state are remembered by the client.
# Once set, this value wins at every launch.

# Capture mouse input for Shepr's mouse UI.
# Set false to let the terminal handle normal clicks, such as clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# mouse_capture = true

# Automatically copy text selected with the mouse.
# Set false to retain drag or double-click word selection until Ctrl+C
# copies and clears it.
# copy_on_select = true

# Pane scrollback lines to scroll per mouse wheel notch.
# Values must be between 1 and 4096 lines.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a workspace name before interactive creation. The prompt starts with
# the name of the new workspace's directory; a blank name keeps that name.
# Set false to create workspaces immediately, named after their directory.
# prompt_new_workspace_name = true

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# agent_panel_sort = "spaces"
# While unset, mouse or key changes to panel order are remembered by the client.
# Once set, this value wins at every launch.

# Agent status indicators: "dots" preserves the compact color marks; "symbols" uses
# distinct static glyphs for Working, Blocked and Idle states.
# status_indicators = "dots"

# Expanded agent rows. Built-ins are state_icon, state_text, machine, workspace,
# pane, agent, terminal_title, and terminal_title_stripped.
# Each layout accepts up to 16 rows, 16 tokens per row, and 16 rules per styled token.
# A token occurrence may be styled with { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Omitted style fields preserve the contextual default.
# [ui.sidebar.agents]
# Blank rows between agent entries.
# row_gap = 0
# rows = [["state_icon", "machine", "workspace"], ["agent"]]
# Optional canonical agent IDs replace the default rows for matching agents.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "machine", "workspace"], ["terminal_title_stripped"], ["agent"]]

# Expanded space rows. Built-ins are state_icon, state_text, workspace, branch, and git_status.
# Inline token styles accept strict #rgb/#rrggbb hex foregrounds plus bold and dim booleans.
# [ui.sidebar.spaces]
# Blank rows between space entries.
# row_gap = 0
# rows = [["state_icon", "workspace"], []]

# Machines whose shepr servers this client shows next to the local one. Each
# entry needs a unique label (how shepr names the machine: nonblank, no control
# characters, no leading or trailing whitespace), an ssh target (a host alias,
# user@host or ssh:// URL, never with a password) and a palette.
# Read once at launch; a duplicate label, a malformed target or a missing or
# unknown palette fails the launch.
# An entry whose label is the local server's label (in any case) is this host's
# own entry and is skipped, so one client.toml listing every host can be copied
# to all of them; its palette is the local server's hue, the accent of
# everything shepr draws. Without such an entry the local server's hue is blue.
# Shepr runs ssh for a machine through a generated config that includes your
# ~/.ssh/config first and adds ServerAliveInterval/ServerAliveCountMax as
# fallbacks (values you set yourself win), and reuses the first authenticated
# connection through a private OpenSSH control socket. Linux's Unix socket path
# limit applies to the private control socket. If XDG_RUNTIME_DIR is too long
# to leave room for the profile runtime directory and generated OpenSSH staging
# suffix, that machine's setup fails.
# palette is a hue name (red, orange, yellow, green, cyan, blue, purple or
# magenta) the expanded sidebar draws this machine's workspace and agent
# entries in. Shepr derives the colours from the background and foreground your
# terminal reports, so they fit its theme: a tinted background (stronger on the
# focused entry), first-line text, dimmer second-line text and an accent (the
# workspace number, the machine name in agent entries), each kept readable
# against the tint, with every host's accent equally bright. Where your
# terminal reports its own colour of that name, its hue is used. Without a
# reported background there is no tint: the accent is the terminal's own ANSI
# colour and the second line is drawn dim. Entries of an unreachable machine
# lose the colour. Token styles set in [ui.sidebar] still win.
# [[machines]]
# label = "build"
# ssh = "dev@build"
# palette = "green"

# Settings for the local server.
# label is the name shepr shows for the local server, under the rules for a
# machine label above, and names this host's own [[machines]] entry. Unset, it
# is this host's short hostname (the part before the first dot); a hostname
# that cannot be read fails the launch until a label is set. The client titles
# the terminal it runs in "shepr: <label>", whichever machine it shows; on exit
# it restores the terminal's previous title where the terminal keeps a title
# stack, and leaves "shepr" elsewhere.
# [local]
# label = "desk"
