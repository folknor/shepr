# shepr configuration
# Place this file at ~/.config/shepr/config.toml
#
# Each process uses its own host's config. An SSH machine decides its panes,
# shell, session, pane borders and gaps, border colours and window title.
# The host running the client decides keys, the sidebar, prompts, mouse and
# copy behaviour, and the colours of everything the client draws.

[theme]
# Built-in themes: catppuccin, catppuccin-latte, terminal, tokyo-night,
#                  tokyo-night-day, dracula, nord, gruvbox, gruvbox-light,
#                  one-dark, one-light, solarized, solarized-light, kanagawa,
#                  kanagawa-lotus, rose-pine, rose-pine-dawn, vesper
# name = "catppuccin"

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# [theme.custom]
# sidebar_bg = "#181825"
# active_row_bg = "#1e1e2e"
# selection_bg = "#313244"
# panel_bg = "reset"
# accent = "#f5c2e7"
# red = "#ff6188"
# green = "#a6e3a1"

[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, or /bin/sh when SHELL is unset. A SHELL that is not
# a usable shell shepr recognizes fails the launch, like a bad value here.
# default_shell = ""

# Start new interactive pane shells as login shells.
# login_shell = false

# CWD policy for new interactive panes and workspaces.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for the directory Shepr was launched from, or a fixed path such as
# "~/Projects". Fixed paths must name an existing directory. Relative paths
# resolve against the launch directory; an empty path is an error.
# new_cwd = "follow"


[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# A prefix that some default binding also uses ("esc" is navigate_back, "-" is
# split_horizontal's key) fails the launch until that binding is set explicitly.
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers ("meta" is an alias for alt),
# and special keys like enter/tab/esc/left/right/up/down/home/end/pageup/pagedown/delete/insert.
# Function key names range from f1 through f35.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# detach = "prefix+q"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "prefix+p"
# next_workspace = "prefix+n"
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# switch_workspace = "prefix+1..9"   # indexed: prefix+1 switches to workspace 1, and so on
# rename_pane = "prefix+shift+p"
# clear_pane = ""                  # unbound; e.g. "prefix+ctrl+k"
# copy_mode = "prefix+["
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# swap_pane_left = "prefix+shift+h"
# swap_pane_down = "prefix+shift+j"
# swap_pane_up = "prefix+shift+k"
# swap_pane_right = "prefix+shift+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"
# resize_mode = "prefix+r"
# resize_pane_left = ""   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
# resize_pane_down = ""   # optional, e.g. "ctrl+shift+alt+down"
# resize_pane_up = ""     # optional, e.g. "ctrl+shift+alt+up"
# resize_pane_right = ""  # optional, e.g. "ctrl+shift+alt+right"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# These are independent from focus_pane_* and do not include prefix+.
# navigate_back = "esc"
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right
# navigate_cycle_pane_next = "tab"
# navigate_cycle_pane_previous = "shift+tab"
# navigate_open_workspace = "enter"
# navigate_switch_workspace = "1..9"

# Size of the virtual terminal used when no client is attached.
# Attached clients always use their own terminal size.
[server]
# headless_cols = 120
# headless_rows = 40

[ui]
# Expanded sidebar width in columns. It must be between sidebar_min_width and
# sidebar_max_width.
# sidebar_width = 26
# While unset, mouse or key changes to sidebar width are remembered by the client.
# Once set, this value wins at every launch.

# Minimum sidebar width when expanded (columns)
# sidebar_min_width = 18

# Maximum sidebar width when expanded (columns)
# sidebar_max_width = 36

# Start with the sidebar collapsed. Changes take effect on the next launch.
# sidebar_start_collapsed = false
# While unset, mouse or key changes to the collapsed state are remembered by the client.
# Once set, this value wins at every launch.

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
# sidebar_collapsed_mode = "compact"

# Capture mouse input for Shepr's mouse UI.
# Set false to let the terminal handle normal clicks, such as clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# mouse_capture = true

# Automatically copy text selected with the mouse.
# Set false to retain drag or double-click word selection until Ctrl+C
# copies and clears it.
# copy_on_select = true

# Host cursor policy: "native" or "drawn".
# "native" uses the outer terminal cursor. "drawn" draws Shepr's cursor as terminal cell content.
# host_cursor = "native"

# Optional modifier that forwards right-click hold/drag gestures to pane apps instead of opening Shepr's pane menu.
# Empty or an off value disables this. Shift is intentionally unsupported
# because terminals commonly reserve Shift+mouse.
# Terminal mouse reports use only ctrl and alt, with keybinding aliases accepted.
# right_click_passthrough_modifier = "off"

# Force a full redraw when the outer terminal regains focus.
# Set false to reduce visible flashing when switching back to Shepr.
# Trade-off: rare host terminal surface corruption may persist until the next full redraw.
# redraw_on_focus_gained = true

# Pane scrollback lines to scroll per mouse wheel notch.
# Values must be between 1 and 4096 lines.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a workspace name before interactive creation.
# Set false to create workspaces immediately with generated names.
# prompt_new_workspace_name = true

# Draw borders around split panes.
# "auto" draws them only for split panes, "always" also frames a lone pane
# (only while pane_outer_borders is enabled), "off" disables them.
# pane_borders = "auto"

# Draw borders along the outside edge of the pane area.
# Disable for tmux-style internal splitters without an outside frame.
# pane_outer_borders = true

# Draw interactive scrollbars beside terminal panes.
# Set false to reclaim the scrollbar column and keep it out of terminal-native selections.
# pane_scrollbars = true

# Keep split panes visually separated instead of sharing divider borders.
# pane_gaps = true

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
# show_agent_labels_on_pane_borders = false

# Title Shepr writes to the terminal it runs in, which is what window managers
# show in title, tab, and group bars. Tokens are {hostname}, {workspace},
# {pane}, and {terminal_title}; {{ and }} are literal braces.
# The title renders on the Shepr server, so {hostname} names the host the panes
# run on even when attaching from a remote client.
# The sanitized title is limited to 200 characters.
# Set to "" to leave the outer terminal title alone.
# window_title = "{hostname}: {workspace}"

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# agent_panel_sort = "spaces"
# While unset, mouse or key changes to panel order are remembered by the client.
# Once set, this value wins at every launch.

# Agent status indicators: "dots" preserves the compact color marks; "symbols" uses
# distinct static glyphs for Working, Blocked and Idle states.
# status_indicators = "dots"

# Accent color for highlights, borders, and navigation UI.
# Unset or empty uses the theme accent.
# Accepts: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b)
# This is an example override; theme.custom.accent takes precedence.
# accent = "#89b4fa"

# Expanded agent rows. Built-ins are state_icon, state_text, machine, workspace,
# pane, agent, terminal_title, and terminal_title_stripped.
# Each layout accepts up to 16 rows, 16 tokens per row, and 16 rules per styled token.
# A token occurrence may be styled with { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Omitted style fields preserve the contextual default.
# [ui.sidebar.agents]
# Blank rows between agent entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["state_icon", "machine", "workspace"], ["agent"]]
# Optional canonical agent IDs replace the default rows for matching agents.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "machine", "workspace"], ["terminal_title_stripped"], ["agent"]]

# Expanded space rows. Built-ins are state_icon, state_text, workspace, branch, and git_status.
# Inline token styles accept strict #rgb/#rrggbb hex foregrounds plus bold and dim booleans.
# [ui.sidebar.spaces]
# Blank rows between space entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Shepr server restart. Needs the agent's hooks, which the server installs at
# launch for every agent present on its host.
# resume_agents_on_restore = true
# Milliseconds between automatic agent restores; 0 starts them without spacing.
# startup_per_agent_delay_ms = 100

# Machines whose shepr servers this client shows next to the local one. Each
# entry needs a unique label (how shepr names the machine: nonblank, no control
# characters, no leading or trailing whitespace) and an ssh target (a host
# alias, user@host or ssh:// URL, never with a password).
# Read once at launch; a duplicate label or a malformed target fails the launch.
# Shepr runs ssh for a machine through a generated config that includes your
# ~/.ssh/config first and adds ServerAliveInterval/ServerAliveCountMax as
# fallbacks (values you set yourself win), and reuses the first authenticated
# connection through a private OpenSSH control socket. Linux's Unix socket path
# limit leaves 26 path bytes for XDG_RUNTIME_DIR in a release build or 22 in a dev
# build, after the profile runtime directory and OpenSSH staging suffix; longer
# paths fail the machine's setup.
# [[machines]]
# label = "build"
# ssh = "dev@build"

[experimental]
# Allow launching shepr from inside a shepr-managed pane.
# allow_nested = false
# Save recent pane screen history across full server restarts.
# pane_history = false
# Expose the focused pane's cursor to the outer terminal so input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane. Unknown
# names are configuration errors.
# Agent labels and declared aliases are accepted, case-insensitively.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Approximate per-pane scrollback budget; nonzero values keep at least 1000 lines.
# scrollback_limit_bytes = 10000000
