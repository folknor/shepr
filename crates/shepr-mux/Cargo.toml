[package]
name = "shepr-mux"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shepr-agent = { path = "../shepr-agent" }
shepr-config = { path = "../shepr-config" }
shepr-core = { path = "../shepr-core" }
shepr-platform = { path = "../shepr-platform" }
shepr-protocol = { path = "../shepr-protocol" }
shepr-pty = { path = "../shepr-pty" }
shepr-termio = { path = "../shepr-termio" }
shepr-vt = { path = "../shepr-vt" }
# `net` provides `AsyncFd`, which the pane runtime waits on a child pidfd with.
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }

[dev-dependencies]
# The symlink-loop test checks the exact Linux errno value.
libc = { workspace = true }
shepr-test-fixtures = { path = "../shepr-test-fixtures" }
shepr-test-support = { path = "../shepr-test-support" }

[lints]
workspace = true
