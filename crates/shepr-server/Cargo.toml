[package]
name = "shepr-server"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-api = ["dep:shepr-test-support", "shepr-mux/test-api", "shepr-config/test-support"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
crossterm = { workspace = true }
ctrlc = { workspace = true }
interprocess = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shepr-agent = { path = "../shepr-agent" }
shepr-api = { path = "../shepr-api" }
shepr-config = { path = "../shepr-config" }
shepr-core = { path = "../shepr-core" }
shepr-mux = { path = "../shepr-mux" }
shepr-platform = { path = "../shepr-platform" }
shepr-protocol = { path = "../shepr-protocol" }
shepr-pty = { path = "../shepr-pty" }
shepr-remote = { path = "../shepr-remote" }
shepr-termio = { path = "../shepr-termio" }
shepr-test-support = { path = "../shepr-test-support", optional = true }
shepr-vt = { path = "../shepr-vt" }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
shepr-agent = { path = "../shepr-agent", features = ["test-support"] }
shepr-api = { path = "../shepr-api", features = ["test-support"] }
shepr-config = { path = "../shepr-config", features = ["test-support"] }
shepr-mux = { path = "../shepr-mux", features = ["test-api"] }
shepr-protocol = { path = "../shepr-protocol", features = ["test-support"] }
shepr-termio = { path = "../shepr-termio", features = ["test-support"] }
shepr-test-support = { path = "../shepr-test-support" }
toml = { workspace = true }

[lints]
workspace = true
