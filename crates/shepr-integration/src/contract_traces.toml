# What each agent plugin sends over a scripted session, as its bun test
# captures it (`contract_traces.ts` checks the match) and as the server crate's
# `agent_integration_contract_tests` module in shepr-server replays it into
# terminal state. Sequences use their rank in the run, and ids use
# `<source>:<rank>`.

# Pi: a path-form new session, its settled idle state, then an agent start that
# reports the working state without repeating the unchanged session identity.
[[pi]]
id = "shepr:pi:1"
method = "pane.report_agent_session"
[pi.params]
pane_id = "test:p1"
source = "shepr:pi"
seq = 1
session_start_source = "new"
agent_session_path = "/nonexistent/pi-new.jsonl"

[[pi]]
id = "shepr:pi:2"
method = "pane.report_agent"
[pi.params]
pane_id = "test:p1"
source = "shepr:pi"
state = "idle"
seq = 2
agent_session_path = "/nonexistent/pi-new.jsonl"

[[pi]]
id = "shepr:pi:3"
method = "pane.report_agent"
[pi.params]
pane_id = "test:p1"
source = "shepr:pi"
state = "working"
seq = 3
agent_session_path = "/nonexistent/pi-new.jsonl"

# Oh My Pi: a startup session that is already working.
[[omp]]
