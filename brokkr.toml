project = "shepr"

# Detection manifests match text agents actually draw on screen (prompt
# glyphs, check marks, spinners); escaping it would make captures unreadable.
[gremlins]
exclude = ["crates/shepr-agent/src/detect/manifests"]

[test]
debug = true

# Name every package because an empty selection checks only a root package.
[[check]]
name = "workspace"
packages = [
    "shepr",
    "shepr-agent",
    "shepr-api",
    "shepr-config",
    "shepr-client",
    "shepr-core",
    "shepr-mux",
    "shepr-platform",
    "shepr-pty",
    "shepr-protocol",
    "shepr-remote",
    "shepr-server",
    "shepr-test-support",
    "shepr-termio",
    "shepr-vt",
]

[manifest]
sort_dependencies = true
lints_workspace_required = true

[[dependency_rule]]
name = "shepr-core-layer"
from = "shepr-core"
allow = ["ratatui", "serde", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-platform-layer"
from = "shepr-platform"
allow = ["crossterm", "futures-util", "interprocess", "libc", "sha2", "time", "tokio", "tracing", "tracing-subscriber", "zbus"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-vt-layer"
from = "shepr-vt"
allow = ["alacritty_terminal", "serde", "shepr-core", "tracing", "unicode-segmentation", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-pty-layer"
from = "shepr-pty"
allow = ["bytes", "libc", "shepr-core", "tokio", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-test-support-layer"
from = "shepr-test-support"
allow = ["libc"]
kinds = ["normal"]

[[dependency_rule]]
name = "alacritty-terminal-only-in-shepr-vt"
from = "*"
forbid = "alacritty_terminal"
except = ["shepr-vt"]

[[dependency_rule]]
name = "shepr-agent-layer"
from = "shepr-agent"
allow = ["jsonc-parser", "libc", "regex", "serde", "serde_json", "shepr-core", "shepr-platform", "toml", "toml_edit", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-protocol-layer"
from = "shepr-protocol"
allow = ["ratatui", "serde", "shepr-core", "shepr-vt", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-config-layer"
from = "shepr-config"
allow = ["crossterm", "ratatui", "serde", "serde_ignored", "serde_json", "shepr-core", "time", "toml"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-api-layer"
from = "shepr-api"
allow = ["interprocess", "regex", "serde", "serde_json", "shepr-agent", "shepr-config", "shepr-platform", "shepr-protocol", "shepr-vt", "tokio", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-termio-layer"
from = "shepr-termio"
allow = ["base64", "crossterm", "ratatui", "serde", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-vt", "toml", "tracing", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-remote-layer"
from = "shepr-remote"
allow = ["interprocess", "libc", "serde", "serde_json", "sha2", "shepr-api", "shepr-config", "shepr-platform", "shepr-protocol", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-client-layer"
from = "shepr-client"
allow = ["base64", "crossterm", "ctrlc", "interprocess", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-remote", "shepr-termio", "shepr-vt", "time", "tokio", "toml", "tracing", "unicode-segmentation", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-mux-layer"
from = "shepr-mux"
allow = ["bytes", "crossterm", "libc", "ratatui", "regex", "serde", "serde_json", "sha2", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-termio", "shepr-vt", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-server-layer"
from = "shepr-server"
allow = ["base64", "bytes", "crossterm", "ctrlc", "interprocess", "libc", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-config", "shepr-core", "shepr-mux", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-remote", "shepr-termio", "shepr-test-support", "shepr-vt", "time", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]
