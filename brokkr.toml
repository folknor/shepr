project = "shepr"

# Detection manifests match text agents actually draw on screen (prompt
# glyphs, check marks, spinners); escaping it would make captures unreadable.
[gremlins]
exclude = ["crates/shepr-agent/src/detect/manifests"]

[test]
debug = true

# Evaluates `[workspace.lints.rustdoc]` in the root Cargo.toml, which nothing
# else runs.
[rustdoc]
document_private_items = true

# The compact codec is positional. These serde shapes either omit fields or
# need self-describing data. Protocol messages also reuse selected shepr-core
# and shepr-vt types directly. Config types never cross the wire, so config
# is not checked. The code region masks string literals, quotes included, so
# a `tag = "..."` argument is matched by the `=` followed by the argument
# separator, the closing paren or the end of a wrapped line.
[[textlint]]
name = "wire-types-use-positional-serde-shapes"
pattern = '\b(?:skip_serializing_if|flatten|untagged)\b|\btag\s*=\s*(?:,|\)|$)'
paths = [
    "crates/shepr-protocol/src/**/*.rs",
    "crates/shepr-core/src/**/*.rs",
    "crates/shepr-vt/src/**/*.rs",
]
except = ['(?:\.|::)flatten\b']
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "toml-only-serde-shape"
allow_marker_above = 1
message = "positional wire types cannot use skip_serializing_if, flatten, untagged or tagged serde enums"

[[textlint]]
name = "persist-clock-is-injected"
pattern = '\b(?:SystemTime|Instant)::now\s*\('
paths = ["crates/shepr-mux/src/persist/**/*.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
message = "pass the operation time into persistence from its caller"

[[textlint]]
name = "app-state-reads-the-clock-seam"
pattern = '\b(?:Instant|SystemTime)::now\s*\('
paths = ["crates/shepr-server/src/app/**/*.rs"]
exclude = ["**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "pass the operation time from the server into app state"

[[textlint]]
name = "remote-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-remote/src/**/*.rs"]
exclude = ["**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "pass time into remote decisions; mark reads measuring elapsed IO"

# The headless loop samples the clock once per pass (`sample_app_clock`) and
# everything it dispatches reads `app.clock`.
[[textlint]]
name = "headless-loop-reads-the-app-clock"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = [
    "crates/shepr-server/src/server/headless.rs",
    "crates/shepr-server/src/server/headless/**/*.rs",
]
exclude = ["**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "headless-clock-sample-ok"
allow_marker_above = 3
message = "read the loop's sample through app.clock; only the sampler reads the clock"

# Platform plumbing takes the clock as a parameter; only the public entry
# points that hand the real clock in read it.
[[textlint]]
name = "platform-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-platform/src/**/*.rs"]
exclude = ["**/tests.rs", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "take the clock as a parameter; mark the entry point that supplies the real one"

[[textlint]]
name = "client-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-client/src/**/*.rs"]
exclude = ["crates/shepr-client/src/lib.rs", "**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "pass time from the client loop or IO owner; mark elapsed real IO reads"

# The client event loop samples the clock at launch, before it waits and once
# an event arrives; everything it dispatches takes those samples.
[[textlint]]
name = "client-loop-clock-is-sampled"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-client/src/lib.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "client-clock-sample-ok"
allow_marker_above = 3
message = "only the client launch and event loop sample the clock"

[[textlint]]
name = "agent-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-agent/src/**/*.rs"]
exclude = ["**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "take the clock as a parameter; mark the adapter that supplies the real one"

# The emulator and PTY actor take time from the read or IO boundary that
# drives them.
[[textlint]]
name = "terminal-core-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-vt/src/**/*.rs", "crates/shepr-pty/src/**/*.rs"]
exclude = ["**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "pass the time in from the read or IO boundary; mark that boundary"

# Server transport outside the app and the headless loop: the client
# handshake, writer and socket plumbing. Its deadlines bound real socket IO.
[[textlint]]
name = "server-transport-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-server/src/**/*.rs"]
exclude = [
    "crates/shepr-server/src/app/**",
    "crates/shepr-server/src/server/headless.rs",
    "crates/shepr-server/src/server/headless/**",
    "crates/shepr-server/src/test_support.rs",
    "**/tests.rs",
    "**/tests/**",
    "**/*_tests.rs",
]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "pass time in from the server loop; mark deadlines that bound real IO"

# The API socket threads, client and session stop. Request timeouts decided
# by the API take the clock; deadlines handed to a real socket reader are
# marked.
[[textlint]]
name = "api-clock-is-injected"
pattern = '\b(?:Instant|SystemTime)::now\b'
paths = ["crates/shepr-api/src/**/*.rs"]
exclude = ["**/tests.rs", "**/tests/**", "**/*_tests.rs"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "clock-io-ok"
allow_marker_above = 3
message = "take the clock as a parameter; mark deadlines that bound real socket IO"

# The clippy seals (`clippy.toml`): the environment reader, exits, bool path
# probes, panic containment, child working directories and debug assertions.
# Every escape is a scoped `#[expect(clippy::disallowed_methods, reason = ..)]`
# (or `disallowed_macros`) naming why the site is outside the seal. Adding a
# file to this exclude list is the review of its escapes.
[[textlint]]
name = "disallowed-escapes-are-allowlisted"
pattern = '\bclippy::disallowed_(?:methods|macros)\b'
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
region = "code"
exclude = [
    "build.rs",
    "crates/shepr-agent/src/integration/config_file/tests.rs",
    "crates/shepr-agent/src/integration/env.rs",
    "crates/shepr-agent/src/integration/opencode_config.rs",
    "crates/shepr-core/src/env.rs",
    "crates/shepr-mux/src/pane/terminal/migration_tests.rs",
    "crates/shepr-mux/src/persist/actor.rs",
    "crates/shepr-mux/src/persist/writer.rs",
    "crates/shepr-platform/src/host.rs",
    "crates/shepr-platform/src/remote_bridge_tests.rs",
    "crates/shepr-platform/src/resize_signal_tests.rs",
    "crates/shepr-pty/src/actor.rs",
    "crates/shepr-pty/src/command.rs",
    "crates/shepr-server/src/app/git_refresh.rs",
    "crates/shepr-server/src/server/headless/tests/already_running.rs",
    "crates/shepr-server/src/server/headless/tests/server_stop.rs",
    "crates/shepr-test-support/src/fixture.rs",
    "crates/shepr-test-support/src/lib.rs",
    "crates/shepr-vt/src/locks.rs",
    "src/test_support.rs",
]
message = "a new clippy seal escape; use the sanctioned alternative the seal's reason names (shepr_core::env, try_exists, a stated current_dir, a returned status), or add this file to the exclude list as the reviewed exception"

# Library crates do not print: a print macro panics on a closed pipe and
# reaches no log file (a client-launched server daemon's stderr is only its
# boot log, which a print after startup would fill). The CLI in
# `src/` resets SIGPIPE before printing and is not held by this rule, nor is the
# `shepr-daemon` executable's `main`, which reports its own boot failures. The
# test-code excludes and `skip_after` spare tests; `check_skip_after_scopes.py`
# re-checks the production items under a file's first `#[cfg(test)]`.
[[textlint]]
name = "library-crates-do-not-print"
pattern = '\b(?:print|println|eprint|eprintln)!\s*[\(\[\{]'
paths = ["crates/*/src/**/*.rs"]
exclude = ["**/tests/**", "**/tests.rs", "**/*_tests.rs", "crates/shepr-test-support/**", "crates/shepr-daemon/**"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
message = "a print macro panics on a closed pipe and reaches no log file; log through tracing, or return the text to the CLI to print"

# The same rule for the stderr handle, which `writeln!` or `write!` reach
# without a print macro: operator text belongs to the CLI in `src/`, and the
# daemon's stderr reaches nobody. `io::stderr()`, `std::io::stderr()` and an
# imported bare `stderr()` all match; a `.stderr(..)` builder method does not.
# A live stream relay (SSH prompts copied to the terminal while ssh runs, as
# in `remote/process.rs`) is not operator text and carries the marker.
[[textlint]]
name = "library-crates-do-not-write-stderr"
pattern = '(?:^|[^.\w])(?:(?:std::)?io::)?stderr\s*\(\s*\)'
paths = ["crates/*/src/**/*.rs"]
exclude = ["**/tests/**", "**/tests.rs", "**/*_tests.rs", "crates/shepr-test-support/**"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "stderr-relay-ok"
allow_marker_above = 3
message = "library code does not write to stderr; log through tracing or return the text to the CLI to print, and mark only a live stream relay with stderr-relay-ok"

# The same rule for the stdout handle: command output belongs to the CLI in
# `src/`, which resets SIGPIPE before printing, and the daemon's stdout reaches
# nobody. The library's legitimate uses take fd 1 over as a whole rather than
# write text to it: the client's host terminal writer and the SSH bridge's
# stdio relay each duplicate the descriptor and own the copy. Those carry the
# marker; the pattern matches as the stderr rule's does.
[[textlint]]
name = "library-crates-do-not-write-stdout"
pattern = '(?:^|[^.\w])(?:(?:std::)?io::)?stdout\s*\(\s*\)'
paths = ["crates/*/src/**/*.rs"]
exclude = ["**/tests/**", "**/tests.rs", "**/*_tests.rs", "crates/shepr-test-support/**"]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "stdout-handoff-ok"
allow_marker_above = 3
message = "library code does not write to stdout; return the text to the CLI to print, and mark only a site that takes fd 1 over as a whole (a terminal writer or a stream relay) with stdout-handoff-ok"

# A logged error's kind is the `error_kind` field, beside `error`. A bare
# `kind` field is left for what is not an error, such as an input event's.
# The field must open a line or follow `(` or `,`, so a `let kind = ..`
# binding does not match.
[[textlint]]
name = "logged-error-kind-is-error-kind"
pattern = '(?:^|[(,])[ \t]*kind\s*=\s*[?%]?\s*[\w.]*\.kind\s*\(\s*\)'
paths = ["crates/**/*.rs", "src/**/*.rs"]
region = "code"
message = "spell a logged error's kind as the error_kind field"

# An exit skips destructors (the host terminal restore, SSH teardown, log
# flushing), so the process ends only by returning from `src/main.rs`. The
# bridge test's re-exec child stands in for that main and exits the same way.
[[textlint]]
name = "exits-from-main"
pattern = '\bprocess::exit\s*\('
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
exclude = ["src/main.rs", "crates/shepr-platform/src/remote_bridge_tests.rs"]
region = "code"
message = "exit only from src/main.rs; return the status or error instead"

# The gate builds the dev profile and `brokkr install` builds release, which no
# sweep builds, so behaviour must not depend on the profile. `clippy.toml`
# bans the debug-assertion macros; this catches the cfg spelling.
[[textlint]]
name = "no-profile-dependent-behaviour"
pattern = '\bdebug_assertions\b'
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
region = "code"
message = "behaviour must not depend on the build profile; the installed build is release and no sweep builds it"

# `include_str!` is for content shepr ships (the default config, detection
# manifests, integration assets). A test reads its fixture from disk, so a
# fixture is not compiled into the test binary and a moved crate fails loudly.
[[textlint]]
name = "no-test-reads-compiled-content"
pattern = '\binclude_(?:str|bytes)!'
paths = ["crates/**/*.rs", "src/**/*.rs"]
exclude = [
    "crates/shepr-config/src/lib.rs",
    "crates/shepr-agent/src/detect/manifest.rs",
    "crates/shepr-agent/src/integration/mod.rs",
]
region = "code"
message = "a test reads its fixture from disk through CARGO_MANIFEST_DIR; include_str! is for content shepr ships"

# No shouting: all-caps emphasis in comments and prose. The excepts are the
# all-caps words that are names, not emphasis: environment variables, terminal
# control sequences, ioctls and poll flags, errno and signal names, quoted
# all-caps literals (screen text in detection manifests) and the detection
# gate vocabulary. The short-word list in each pattern is the words already
# swept, not every short shout; widen it one word at a time, sweeping first.
[textlint_preset.no-shouting]
allow_marker = "shout-ok"
allow_marker_above = 2
except = [
    '[$%]\{?[A-Z][A-Z0-9_]*',
    '\b[A-Z][A-Z0-9_]{3,}\s*[:=]',
    '\b(?:env!|env::var(?:_os)?|getenv|environ|EnvVar::)',
    'https?://',
    '^\s*(?://[/!]?|\*|#+)?\s*(?:SAFETY|PANICS|ERRORS|INVARIANT|WARNING)\b',  # shout-ok: pattern text
    '"\[?[A-Z][A-Z0-9_]{4,}\]?"',
    '\b(?:ASCII|UTF|POSIX|JSONL|README|LICENSE|MSRV|TOCTOU|COLORTERM)\b',
    '\bSIG[A-Z0-9]+\b',
    '\b(?:ESRCH|EPIPE|ECONNRESET|ECONNREFUSED|ECONNABORTED|EAGAIN|EWOULDBLOCK|ELOOP|ETXTBSY|EACCES|EADDRINUSE|EBUSY|ENOSPC|ENOENT|EINVAL|EPERM|EINTR|EBADF|ECHILD|ENOTDIR|EISDIR|EMFILE|ENFILE|ETIMEDOUT|ENOTCONN|ENOPROTOOPT|EOVERFLOW|EFBIG|EFAULT|ENOTTY)\b',
    '\b(?:DECRQM|DECSCUSR|DECSC|DECRC|DECSED|DECCOLM|DECCKM|DECSET|DECRST|XTGETTCAP|XTMODKEYS|XTWINOPS|XTVERSION)\b',
    '\b(?:TIOCSCTTY|TIOCSWINSZ|TIOCGWINSZ|POLLHUP|POLLERR|WEXITED|O_NONBLOCK)\b',
    '\bAND/OR(?:/NOT)?\b',
    '\b(?:AGENTS|CLAUDE)\.md',
]

[[textlint]]
name = "no-shouting-rust"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
region = "comment"
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-hash-comments"
preset = "no-shouting"
pattern = '#[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = [
    "Cargo.toml",
    "brokkr.toml",
    "clippy.toml",
    ".review.toml",
    "crates/**/*.toml",
    "crates/**/*.sh",
    "crates/**/*.py",
    "crates/**/*.yaml",
    "scripts/**/*.py",
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-script-comments"
preset = "no-shouting"
pattern = '//[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["crates/**/*.ts", "crates/**/*.js"]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-short-shouting-markdown"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b(?:ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["**/*.md"]
exclude = ["research/**", "notes/**", "AGENTS.md", "CLAUDE.md"]
except = [
    '^ {4,}\S',
    '^\t',
    '^\s*"?[a-z_][a-z0-9_.-]*"?\s*[:=]\s*\S',
    '^\s*\{"',
    '^\s*(?:\$|#\s)?\s*(?:shepr|brokkr|cargo|git|ssh|export)\b',
    '^\s*Usage:\s',
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-markdown"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b[A-Z]{5,}(?:-[^0-9]|[^\w-]|$)'
paths = ["**/*.md"]
exclude = ["research/**", "AGENTS.md", "CLAUDE.md"]
except = [
    '^ {4,}\S',
    '^\t',
    '^\s*"?[a-z_][a-z0-9_.-]*"?\s*[:=]\s*\S',
    '^\s*\{"',
    '^\s*(?:\$|#\s)?\s*(?:shepr|brokkr|cargo|git|ssh|export)\b',
    '^\s*Usage:\s',
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

# The agent instruction files are instructions to agents, reworded at will; a
# code comment carries its reason in place. brokkr.toml is left out of `paths`
# because this rule's own pattern would match.
[[textlint]]
name = "code-does-not-cite-agent-instructions"
pattern = '\b(?:AGENTS|CLAUDE)\.md\b'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml"]
message = "code does not cite the agent instruction files; state the reason in place"

# shepr has never been run, so no older build, install or on-disk shape exists.
# Deliberately not matched: "old server" (an in-place upgrade on a remote host
# leaves the previous server running) and "legacy format" (kitty's name for the
# legacy key encoding).
[[textlint]]
name = "no-predeployment-older-peer-compatibility"
pattern = '(?i)\b(?:older|old|previous|earlier|legacy|pre-fork)\s+(?:builds?|binar(?:y|ies)|installs?|installations?|peers?|schemas?|shepr|herdr)\b|\bduring the migration\b|\blegacy (?:preferences|fields?|files?|sessions?)\b'
paths = ["crates/**/*.rs", "src/**/*.rs"]
region = "comment"
message = "shepr has never been run: no older build, install or on-disk shape exists to stay compatible with; describe the current invariant or remove the code"

# A work-item label is a citation of the notes folder in disguise, and an issue
# number names herdr's tracker, which a hard fork does not have.
[[textlint]]
name = "durable-text-has-no-plan-labels"
pattern = '\b(?:BUG|HYG[GVPC]|CMD)-\d+\b|\b(?:[Rr]ound|[Pp]hase|[Ww]ave|[Mm]ilestone)\s+\d+[a-z]?\b|\b[Ss]pec\s+[A-Z0-9]\b|\bfinding-\d+\b'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml"]
message = "a work-item label means nothing once its note is gone; state the invariant in place"

[[textlint]]
name = "no-upstream-issue-citations"
pattern = '(?i)\bissue\s+#\d+|\(#\d+\)|\bon #\d+\b'
paths = ["crates/**", "src/**", "build.rs"]
message = "an issue number names herdr's tracker, which shepr does not have; state the behaviour the issue described"

# No `region`: the pattern needs the string literal's opening quote, which a
# code region masks.
[[textlint]]
name = "no-relative-dot-directory-path"
pattern = '\b(?:PathBuf::from|Path::new)\(\s*"\.[A-Za-z_]'
paths = ["crates/**/*.rs", "src/**/*.rs"]
message = "a relative dot-directory path resolves against the working directory, which under cargo test is the crate directory; in a test use shepr_test_support::ScratchDir, and for a path only compared or rendered spell it /nonexistent/..."

# Test data and scratch state live under the project's build tree, never the
# host's shared temp directory. `clippy.toml` bans `std::env::temp_dir` by path;
# this catches the spelling, including a site that would expect its way past
# the clippy ban, since no site has an escape.
[[textlint]]
name = "no-host-temp-dir"
pattern = '\btemp_dir\s*\('
paths = ["crates/**/*.rs", "src/**/*.rs", "tests/**/*.rs", "build.rs"]
region = "code"
message = "scratch state lives under the build tree, not the host temp directory; use shepr_test_support::ScratchDir"

# Tests spawn the workspace-built fixture program
# (`shepr_test_support::fixture`), never a program borrowed from the host, so
# a fixture's behaviour is the repository's to define. The rules scan
# production code too; its spawns of the shell and Git are production
# behaviour and carry the marker, as do the two exempt kinds of test: those
# whose subject is a script run under its interpreter (the generated remote
# scripts, the shipped hook assets), and those of production code that itself
# spawns Git, whose fixtures only Git can write. The marker names which, on
# the line or the two above it.
[textlint_preset.host-programs]
paths = ["crates/**/*.rs", "src/**/*.rs", "tests/**/*.rs"]
allow_marker = "host-program-ok"
allow_marker_above = 2

[[textlint]]
name = "no-borrowed-process-stand-ins"
preset = "host-programs"
pattern = '\b(?:(?:Pty)?Command::new|PaneShellConfig::new|interactive_shell)\(\s*"(?:/usr)?(?:/s?bin/)?(?:sh|bash|dash|zsh|sleep|true|false|yes|cat|echo|printf|head|tr|ps|env|git)"'
message = "spawn a shepr_test_support::fixture script; a borrowed host utility makes the fixture's behaviour the host's to define (host-program-ok: <why> where the host program is the subject)"

[[textlint]]
name = "no-interpreter-stand-ins"
preset = "host-programs"
pattern = '\bCommand::new\(\s*"(?:/usr)?(?:/s?bin/)?(?:python3?|perl|ruby|node|bun)"'
message = "spawn a shepr_test_support::fixture script, not a language runtime the host may not have (host-program-ok: <why> where the script under it is the subject)"

[[textlint]]
name = "no-authored-shell-stubs"
preset = "host-programs"
pattern = '#!\s*/(?:usr/)?s?bin/'
message = "a fixture needing a program installs a shepr_test_support::fixture::stand_in; an authored shell stub depends on the host's shell and whatever it shells out to"

[[textlint]]
name = "fixtures-compile-their-own-executables"
preset = "host-programs"
pattern = '\b(?:fs::copy|hard_link|symlink)\s*\(\s*"/'
message = "install a shepr_test_support::fixture::stand_in, not a host binary; a multi-call coreutils image dispatches on argv[0] and a renamed copy resolves no applet"

# Nothing durable sends its reader into the notes folder. brokkr.toml is left
# out of `paths` for the same self-match reason as the agent-instructions rule,
# and the message avoids spelling the folder with a slash.
[[textlint]]
name = "durable-text-does-not-cite-notes"
pattern = '(?:^|[^\w/.-])notes/'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml", "LLM.md", "docs/**", "reference/**"]
allow_marker = "doc-conventions-ok"
message = "a durable file may not send its reader into the notes folder, which carries no truth guarantee; carry the context here"

# The codec already caps every collection at MAX_COLLECTION_ITEMS, so a
# bounded-vec annotation at that cap repeats the default. No `region`: the
# annotation sits inside a serde attribute's string literal.
[[textlint]]
name = "no-default-cap-bounded-vec"
pattern = 'bounded_vec::<\{\s*(?:codec::)?MAX_COLLECTION_ITEMS\s*\}'
paths = ["crates/shepr-protocol/src/**/*.rs"]
message = "the codec caps every collection at MAX_COLLECTION_ITEMS already; annotate bounded_vec only with a tighter cap"

# Every numeric or Duration bound lives in its crate's `limits` module
# (`crates/<crate>/src/limits.rs`, and `src/limits.rs` for the binary), named,
# documented and beside the bounds it is coupled with. A value that is a format,
# ABI or protocol definition rather than a tunable stays beside the code it
# defines and carries `limits-exempt: <reason>` on its line or one of the two
# above; `limits-exempt-states-a-reason` refuses a marker without one. Keep the
# scope and test exclusions of the two limits rules in lockstep.
#
# The first rule takes a numeric, `Duration` or `NonZero` const or static whose
# initializer has a numeric literal on its first line, or wraps onto the next.
# The second takes the literal shapes a bound is usually spelled in outside a
# const: a `Duration::from_*` literal, and a literal of two or more digits as a
# channel, `with_capacity` or `Semaphore` capacity, an iterator `take` count or
# a zeroed buffer length. Neither catches a literal inline in any other
# expression (a comparison `len() > 32`, a `.clamp(3, 15)` range, a factor in
# arithmetic), a single-digit capacity, buffer or count (`sync_channel(1)`,
# `[0u8; 4]`), a channel turbofish with nested generics, an array-typed const,
# a numeric value in a string (an ssh option), an atomic counter (allocator
# state, not a bound), or test code: test files, and items below a file's first
# `#[cfg(test)]`, where `check_skip_after_scopes.py` re-checks the production
# items. A const initialized from other names (an alias or derivation of a named
# bound) is deliberately not a bound of its own. Values inside a `limits` module
# are not checked for a doc comment or a reason.
[[textlint]]
name = "numeric-consts-live-in-limits"
pattern = '\b(?:const|static)\s+[A-Z][A-Z0-9_]*\s*:\s*(?:[ui](?:8|16|32|64|128|size)|f(?:32|64)|(?:(?:std|core)::time::)?Duration|(?:std::num::)?NonZero(?:U|I)(?:8|16|32|64|128|size)|(?:libc::)?c_u?(?:char|short|int|long))\s*=(?:[^;]*\b[0-9]|\s*$)'
paths = ["crates/*/src/**/*.rs", "src/**/*.rs"]
exclude = [
    "crates/*/src/limits.rs",
    "src/limits.rs",
    "crates/shepr-test-support/**",
    "crates/shepr-test-fixtures/**",
    "**/test_support.rs",
    "**/test_support/**",
    "**/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
]
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "limits-exempt:"
allow_marker_above = 2
message = "a numeric or Duration const is a bound: move it into this crate's limits module, or mark it `limits-exempt: <reason>` if it is a format, ABI or protocol definition"

[[textlint]]
name = "duration-and-capacity-literals-live-in-limits"
pattern = '\bDuration\s*::\s*from_(?:secs|millis|micros|nanos|mins|hours|secs_f32|secs_f64)\s*\(\s*[0-9]|(?:\b(?:sync_channel|channel)\s*(?:::\s*<[^>]*>\s*)?|\bwith_capacity\s*|\bSemaphore\s*::\s*new\s*|\.take\s*)\(\s*[0-9](?:_?[0-9])+|\[\s*0(?:_?u8)?\s*;\s*[0-9](?:_?[0-9])+'
paths = ["crates/*/src/**/*.rs", "src/**/*.rs"]
exclude = [
    "crates/*/src/limits.rs",
    "src/limits.rs",
    "crates/shepr-test-support/**",
    "crates/shepr-test-fixtures/**",
    "**/test_support.rs",
    "**/test_support/**",
    "**/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
]
except = ['^\s*(?:pub(?:\([^)]*\))?\s+)?(?:const|static)\s+[A-Z][A-Z0-9_]*\s*:']
skip_after = '^[ \t]*#\[cfg\(test\)\]'
region = "code"
allow_marker = "limits-exempt:"
allow_marker_above = 2
message = "a literal duration, capacity, count or buffer size is a bound: name it in this crate's limits module, or mark it `limits-exempt: <reason>` if it is a format, ABI or protocol definition"

[[textlint]]
name = "limits-exempt-states-a-reason"
pattern = '\blimits-exempt(?:[^:\w-]|:\s*$|$)'
paths = ["crates/*/src/**/*.rs", "src/**/*.rs"]
region = "comment"
message = "spell the marker `limits-exempt: <reason>`, naming the format, ABI or protocol the value defines"

# Every internal event the headless server handles goes through the one method
# that also forwards clipboard writes to the foreground client.
[[textlint]]
name = "headless-internal-events-go-through-forwarding"
pattern = '\.handle_internal_event(?:_with_[a-z_]+)?\s*\('
paths = ["crates/shepr-server/src/server/**/*.rs"]
exclude = [
    "crates/shepr-server/src/server/headless/internal_events.rs",
    "crates/shepr-server/src/server/headless/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
]
except = ['\bhandle_internal_event_with_forwarding\s*\(']
region = "code"
message = "route an internal event through HeadlessServer::handle_internal_event_with_forwarding, which forwards clipboard writes to the foreground client"

# A failure carried on a tracing event is keyed `error`, so one log query finds
# every failure. Matched are an `err = ` field (`=` not followed by `=` or `>`,
# so comparisons and match arms pass) and the `%err` / `?err` shorthands, each
# opening a line or following `(`, `,` or `{`. A bare `err` field (a captured
# variable, `warn!(err, ..)`) reads the same as a call argument and is not
# caught; spell it `error = err`. A value `%err` wrapped onto a line of its own
# after `error =` is flagged too; keep a field and its value on one line.
[[textlint]]
name = "tracing-failure-field-is-error"
pattern = '(?:^|[(,{])\s*(?:err\s*=(?:[^=>]|$)|[%?]err\b)'
paths = ["crates/**/*.rs", "src/**/*.rs", "tests/**/*.rs", "build.rs"]
region = "code"
message = "key a failure on a tracing event `error` (error = %err), not `err`"

[[script_check]]
name = "cited-paths"
command = "python3 scripts/check_cited_paths.py"
expect = "cited paths ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "textlint-regions"
command = "python3 scripts/check_textlint_regions.py"
expect = "textlint regions ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "skip-after-scopes"
command = "python3 scripts/check_skip_after_scopes.py"
expect = "skip_after scopes ok"
match = "last-line"
stage = "pre-clippy"

# The backstop for a test writing through a path relative to its crate
# directory: crate roots hold only a crate's own parts, and untracked files in
# the sources carry an extension the tracked sources use.
[[script_check]]
name = "tree-debris"
command = "python3 scripts/check_tree_debris.py"
expect = "tree debris ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "scripts-roster"
command = "python3 scripts/check_scripts_roster.py"
expect = "scripts roster ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "workspace-dependencies"
command = "python3 scripts/check_workspace_dependencies.py"
expect = "workspace dependencies ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "seal-paths"
command = "python3 scripts/check_seal_paths.py"
expect = "seal paths ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "upstream-watch-paths"
command = "python3 scripts/check_upstream_watch_paths.py"
expect = "upstream watch paths ok"
match = "last-line"
stage = "pre-clippy"

# The agent plugins that load into a JavaScript agent (Pi, Oh My Pi, opencode,
# Kilo) are tested with bun, a development dependency.
[[script_check]]
name = "agent-asset-tests"
command = "python3 scripts/check_agent_asset_tests.py"
expect = "agent asset tests ok"
match = "last-line"
stage = "pre-test"

# Name every package because an empty selection checks only a root package.
[[check]]
name = "workspace"
packages = [
    "shepr",
    "shepr-agent",
    "shepr-api",
    "shepr-config",
    "shepr-client",
    "shepr-core",
    "shepr-daemon",
    "shepr-mux",
    "shepr-platform",
    "shepr-pty",
    "shepr-protocol",
    "shepr-remote",
    "shepr-server",
    "shepr-test-fixtures",
    "shepr-test-support",
    "shepr-termio",
    "shepr-vt",
]
# The fixture program tests spawn instead of host programs
# (`shepr_test_support::fixture`). Testing shepr-test-support builds it too;
# this also builds it for a `brokkr test -p` that names another package.
# The `shepr-server` executable (package `shepr-daemon`) is built here as well:
# the root package's process tests spawn it next to the `shepr` binary, and a
# bin of another package is not built for them by cargo.
build_packages = ["shepr-test-support", "shepr-daemon"]

# The workspace sweep unifies every member's features, dev-dependencies
# included, so it never compiles the binary alone. The install-feature phase
# checks `shepr` as `cargo install` resolves it, with nothing a sibling member
# or a dev-dependency contributes. It is a `cargo check` (no codegen) in the
# profile `brokkr install` uses; it builds and runs nothing.
#
# The client `shepr` (the root package) and the server executable
# `shepr-server` (package `shepr-daemon`) are installed together: `brokkr
# install` runs `cargo install --path` once per listed package, in order. Both
# take their build id from the one shepr-protocol they link. `brokkr run` runs
# a single named target and builds only that one, so the default is the client;
# the client launches its sibling `shepr-server` from its own directory, which
# a dev run must have built first.
[bin]
default = "shepr"
install = ["shepr", "shepr-daemon"]
install_feature_check = "always"

[manifest]
sort_dependencies = true
lints_workspace_required = true

[[dependency_rule]]
name = "shepr-core-layer"
from = "shepr-core"
allow = ["serde"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-platform-layer"
from = "shepr-platform"
allow = ["crossterm", "futures-util", "interprocess", "libc", "sha2", "shepr-core", "tokio", "tracing", "tracing-subscriber", "zbus"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-vt-layer"
from = "shepr-vt"
allow = ["alacritty_terminal", "serde", "shepr-core", "unicode-width", "vte"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-pty-layer"
from = "shepr-pty"
allow = ["bytes", "libc", "shepr-core", "tracing"]
kinds = ["normal"]

# `IsolatedEnv` isolates tests from `shepr_core::env`'s registry, so a
# variable added there is isolated with no change in this crate. libc is the
# fixture program's signals, file-size limit and session id.
[[dependency_rule]]
name = "shepr-test-support-layer"
from = "shepr-test-support"
allow = ["libc", "shepr-core"]
kinds = ["normal"]

# Test fixtures are crates, not features of production crates: a feature is
# switched on for every consumer in a build that compiles any consumer's
# tests, while an absent normal or build edge holds under every feature
# resolution. These two rules are that absence. The fixture crates' module
# docs say why each is a crate.
[[dependency_rule]]
name = "test-support-never-ships"
from = "*"
forbid = "shepr-test-support"
kinds = ["normal", "build"]

[[dependency_rule]]
name = "test-fixtures-never-ships"
from = "*"
forbid = "shepr-test-fixtures"
kinds = ["normal", "build"]

# Built on the public API of the crates it stands in for. A crate it depends
# on cannot take it as a dev-dependency without linking a second copy of
# itself, so the list stays low: config, protocol, pty and termio.
[[dependency_rule]]
name = "shepr-test-fixtures-layer"
from = "shepr-test-fixtures"
allow = ["bytes", "serde", "shepr-config", "shepr-core", "shepr-protocol", "shepr-pty", "shepr-termio", "tokio"]
kinds = ["normal"]

[[dependency_rule]]
name = "alacritty-terminal-only-in-shepr-vt"
from = "*"
forbid = "alacritty_terminal"
except = ["shepr-vt"]

# ratatui is a drawing library, taken only by the crates that draw or carry
# its values: protocol converts drawn buffers to wire frames, config resolves
# theme colors, termio paints selections and scrollbars, mux renders panes,
# and server and client compose the screen. The pane layout model below them
# computes in `shepr_core`'s own `Rect` and `Direction`.
[[dependency_rule]]
name = "ratatui-only-in-drawing-crates"
from = "*"
forbid = "ratatui"
except = ["shepr-client", "shepr-config", "shepr-mux", "shepr-protocol", "shepr-server", "shepr-termio"]

[[dependency_rule]]
name = "shepr-agent-layer"
from = "shepr-agent"
allow = ["jsonc-parser", "libc", "regex", "serde", "serde_json", "shepr-core", "shepr-platform", "toml", "toml_edit", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-config-layer"
from = "shepr-config"
allow = ["crossterm", "ratatui", "serde", "serde_ignored", "shepr-agent", "shepr-core", "shepr-platform", "toml"]
kinds = ["normal"]

# Protocol shares grid and input-batch limits with config; config never
# depends on protocol.
[[dependency_rule]]
name = "shepr-protocol-layer"
from = "shepr-protocol"
allow = ["ratatui", "serde", "shepr-config", "shepr-core", "shepr-vt", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-api-layer"
from = "shepr-api"
allow = ["interprocess", "serde", "serde_json", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-vt", "tokio", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-termio-layer"
from = "shepr-termio"
allow = ["base64", "crossterm", "ratatui", "serde", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-vt", "tracing", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-remote-layer"
from = "shepr-remote"
allow = ["interprocess", "serde", "serde_json", "shepr-api", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-client-layer"
from = "shepr-client"
allow = ["base64", "crossterm", "ctrlc", "interprocess", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-remote", "shepr-termio", "shepr-vt", "tokio", "toml", "tracing", "unicode-segmentation", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-mux-layer"
from = "shepr-mux"
allow = ["bytes", "crossterm", "ratatui", "regex", "serde", "serde_json", "sha2", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-termio", "shepr-vt", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]

# The client binary launches the server executable as a sibling process and
# never links the server library or the multiplexer beneath it.
[[dependency_rule]]
name = "shepr-binary-layer"
from = "shepr"
allow = ["clap", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-client", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-remote", "tracing"]
kinds = ["normal"]

# The server executable links the server and not the client.
[[dependency_rule]]
name = "shepr-daemon-layer"
from = "shepr-daemon"
allow = ["shepr-api", "shepr-config", "shepr-platform", "shepr-protocol", "shepr-server"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-server-layer"
from = "shepr-server"
allow = ["base64", "bytes", "crossterm", "ctrlc", "interprocess", "libc", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-config", "shepr-core", "shepr-mux", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-remote", "shepr-termio", "shepr-vt", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]
