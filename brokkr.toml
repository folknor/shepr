project = "shepr"

# Detection manifests match text agents actually draw on screen (prompt
# glyphs, check marks, spinners); escaping it would make captures unreadable.
[gremlins]
exclude = ["crates/shepr-agent/src/detect/manifests"]

[test]
debug = true

# The environment seal (`clippy.toml`, `shepr_core::env`). Every raw
# `std::env` read or write outside the reader carries a scoped
# `#[expect(clippy::disallowed_methods, reason = ..)]` naming why the site is
# outside the policy. Adding a file to this exclude list is the review of its
# escape.
[[textlint]]
name = "disallowed-escapes-are-allowlisted"
pattern = '\bclippy::disallowed_methods\b'
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
region = "code"
exclude = [
    "build.rs",
    "crates/shepr-agent/src/integration/config_file/tests.rs",
    "crates/shepr-agent/src/integration/env.rs",
    "crates/shepr-agent/src/integration/opencode_config.rs",
    "crates/shepr-core/src/env.rs",
    "crates/shepr-mux/src/pane/terminal/migration_tests.rs",
    "crates/shepr-platform/src/remote_bridge_tests.rs",
    "crates/shepr-pty/src/command.rs",
    "crates/shepr-test-support/src/lib.rs",
    "src/test_support.rs",
]
message = "a new clippy seal escape; read or write through shepr_core::env, or add this file to the exclude list as the reviewed exception"

# No shouting: all-caps emphasis in comments and prose. The excepts are the
# all-caps words that are names, not emphasis: environment variables, terminal
# control sequences, ioctls and poll flags, errno and signal names, quoted
# all-caps literals (screen text in detection manifests) and the detection
# gate vocabulary. The short-word list in each pattern is the words already
# swept, not every short shout; widen it one word at a time, sweeping first.
[textlint_preset.no-shouting]
allow_marker = "shout-ok"
allow_marker_above = 2
except = [
    '[$%]\{?[A-Z][A-Z0-9_]*',
    '\b[A-Z][A-Z0-9_]{3,}\s*[:=]',
    '\b(?:env!|env::var(?:_os)?|getenv|environ|EnvVar::)',
    'https?://',
    '^\s*(?://[/!]?|\*|#+)?\s*(?:SAFETY|PANICS|ERRORS|INVARIANT|WARNING)\b',  # shout-ok: pattern text
    '"\[?[A-Z][A-Z0-9_]{4,}\]?"',
    '\b(?:ASCII|UTF|POSIX|JSONL|README|LICENSE|MSRV|TOCTOU|COLORTERM)\b',
    '\bSIG[A-Z0-9]+\b',
    '\b(?:ESRCH|EPIPE|ECONNRESET|ECONNREFUSED|ECONNABORTED|EAGAIN|EWOULDBLOCK|ELOOP|ETXTBSY|EACCES|EADDRINUSE|EBUSY|ENOSPC|ENOENT|EINVAL|EPERM|EINTR|EBADF|ECHILD|ENOTDIR|EISDIR|EMFILE|ENFILE|ETIMEDOUT|ENOTCONN|ENOPROTOOPT|EOVERFLOW|EFBIG|EFAULT|ENOTTY)\b',
    '\b(?:DECRQM|DECSCUSR|DECSC|DECRC|DECSED|DECCOLM|DECCKM|DECSET|DECRST|XTGETTCAP|XTMODKEYS|XTWINOPS|XTVERSION)\b',
    '\b(?:TIOCSCTTY|TIOCSWINSZ|TIOCGWINSZ|POLLHUP|POLLERR|WEXITED|O_NONBLOCK)\b',
    '\bAND/OR(?:/NOT)?\b',
    '\b(?:AGENTS|CLAUDE)\.md',
]

[[textlint]]
name = "no-shouting-rust"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["crates/**/*.rs", "src/**/*.rs", "build.rs"]
region = "comment"
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-hash-comments"
preset = "no-shouting"
pattern = '#[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = [
    "Cargo.toml",
    "brokkr.toml",
    "clippy.toml",
    ".review.toml",
    "crates/**/*.toml",
    "crates/**/*.sh",
    "crates/**/*.py",
    "crates/**/*.yaml",
    "scripts/**/*.py",
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-script-comments"
preset = "no-shouting"
pattern = '//[^`]*(?:`[^`]*`[^`]*)*\b(?:[A-Z]{5,}|ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["crates/**/*.ts", "crates/**/*.js"]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-short-shouting-markdown"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b(?:ALL|BOTH|MUST|NEVER|NOT|ONE|ONLY|SAME)\b'
paths = ["**/*.md"]
exclude = ["research/**", "notes/**", "AGENTS.md", "CLAUDE.md"]
except = [
    '^ {4,}\S',
    '^\t',
    '^\s*"?[a-z_][a-z0-9_.-]*"?\s*[:=]\s*\S',
    '^\s*\{"',
    '^\s*(?:\$|#\s)?\s*(?:shepr|brokkr|cargo|git|ssh|export)\b',
    '^\s*Usage:\s',
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-markdown"
preset = "no-shouting"
pattern = '^[^`]*(?:`[^`]*`[^`]*)*\b[A-Z]{5,}(?:-[^0-9]|[^\w-]|$)'
paths = ["**/*.md"]
exclude = ["research/**", "AGENTS.md", "CLAUDE.md"]
except = [
    '^ {4,}\S',
    '^\t',
    '^\s*"?[a-z_][a-z0-9_.-]*"?\s*[:=]\s*\S',
    '^\s*\{"',
    '^\s*(?:\$|#\s)?\s*(?:shepr|brokkr|cargo|git|ssh|export)\b',
    '^\s*Usage:\s',
]
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

# The agent instruction files are instructions to agents, reworded at will; a
# code comment carries its reason in place. brokkr.toml is left out of `paths`
# because this rule's own pattern would match.
[[textlint]]
name = "code-does-not-cite-agent-instructions"
pattern = '\b(?:AGENTS|CLAUDE)\.md\b'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml"]
message = "code does not cite the agent instruction files; state the reason in place"

# shepr has never been run, so no older build, install or on-disk shape exists.
# Deliberately not matched: "old server" (an in-place upgrade on a remote host
# leaves the previous server running) and "legacy format" (kitty's name for the
# legacy key encoding).
[[textlint]]
name = "no-predeployment-older-peer-compatibility"
pattern = '(?i)\b(?:older|old|previous|earlier|legacy|pre-fork)\s+(?:builds?|binar(?:y|ies)|installs?|installations?|peers?|schemas?|shepr|herdr)\b|\bduring the migration\b|\blegacy (?:preferences|fields?|files?|sessions?)\b'
paths = ["crates/**/*.rs", "src/**/*.rs"]
region = "comment"
message = "shepr has never been run: no older build, install or on-disk shape exists to stay compatible with; describe the current invariant or remove the code"

# A work-item label is a citation of the notes folder in disguise, and an issue
# number names herdr's tracker, which a hard fork does not have.
[[textlint]]
name = "durable-text-has-no-plan-labels"
pattern = '\b(?:BUG|HYG[GVPC]|CMD)-\d+\b|\b(?:[Rr]ound|[Pp]hase|[Ww]ave|[Mm]ilestone)\s+\d+[a-z]?\b|\b[Ss]pec\s+[A-Z0-9]\b|\bfinding-\d+\b'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml"]
message = "a work-item label means nothing once its note is gone; state the invariant in place"

[[textlint]]
name = "no-upstream-issue-citations"
pattern = '(?i)\bissue\s+#\d+|\(#\d+\)|\bon #\d+\b'
paths = ["crates/**", "src/**", "build.rs"]
message = "an issue number names herdr's tracker, which shepr does not have; state the behaviour the issue described"

# No `region`: the pattern needs the string literal's opening quote, which a
# code region masks.
[[textlint]]
name = "no-relative-dot-directory-path"
pattern = '\b(?:PathBuf::from|Path::new)\(\s*"\.[A-Za-z_]'
paths = ["crates/**/*.rs", "src/**/*.rs"]
message = "a relative dot-directory path resolves against the working directory, which under cargo test is the crate directory; in a test use shepr_test_support::ScratchDir, and for a path only compared or rendered spell it /nonexistent/..."

# Test data and scratch state live under the project's build tree, never the
# host's shared temp directory. `clippy.toml` bans `std::env::temp_dir` by path;
# this catches the spelling, including a site that would expect its way past
# the clippy ban, since no site has an escape.
[[textlint]]
name = "no-host-temp-dir"
pattern = '\btemp_dir\s*\('
paths = ["crates/**/*.rs", "src/**/*.rs", "tests/**/*.rs", "build.rs"]
region = "code"
message = "scratch state lives under the build tree, not the host temp directory; use shepr_test_support::ScratchDir"

# Nothing durable sends its reader into the notes folder. brokkr.toml is left
# out of `paths` for the same self-match reason as the agent-instructions rule,
# and the message avoids spelling the folder with a slash.
[[textlint]]
name = "durable-text-does-not-cite-notes"
pattern = '(?:^|[^\w/.-])notes/'
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "clippy.toml", "LLM.md", "docs/**", "reference/**"]
allow_marker = "doc-conventions-ok"
message = "a durable file may not send its reader into the notes folder, which carries no truth guarantee; carry the context here"

# Every internal event the headless server handles goes through the one method
# that also forwards clipboard writes to the foreground client.
[[textlint]]
name = "headless-internal-events-go-through-forwarding"
pattern = '\.handle_internal_event(?:_with_[a-z_]+)?\s*\('
paths = ["crates/shepr-server/src/server/**/*.rs"]
exclude = [
    "crates/shepr-server/src/server/headless/internal_events.rs",
    "crates/shepr-server/src/server/headless/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
]
except = ['\bhandle_internal_event_with_forwarding\s*\(']
region = "code"
message = "route an internal event through HeadlessServer::handle_internal_event_with_forwarding, which forwards clipboard writes to the foreground client"

[[script_check]]
name = "cited-paths"
command = "python3 scripts/check_cited_paths.py"
expect = "cited paths ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "textlint-regions"
command = "python3 scripts/check_textlint_regions.py"
expect = "textlint regions ok"
match = "last-line"
stage = "pre-clippy"

[[script_check]]
name = "skip-after-scopes"
command = "python3 scripts/check_skip_after_scopes.py"
expect = "skip_after scopes ok"
match = "last-line"
stage = "pre-clippy"

# Name every package because an empty selection checks only a root package.
[[check]]
name = "workspace"
packages = [
    "shepr",
    "shepr-agent",
    "shepr-api",
    "shepr-config",
    "shepr-client",
    "shepr-core",
    "shepr-mux",
    "shepr-platform",
    "shepr-pty",
    "shepr-protocol",
    "shepr-remote",
    "shepr-server",
    "shepr-test-support",
    "shepr-termio",
    "shepr-vt",
]

[manifest]
sort_dependencies = true
lints_workspace_required = true

[[dependency_rule]]
name = "shepr-core-layer"
from = "shepr-core"
allow = ["ratatui", "serde"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-platform-layer"
from = "shepr-platform"
allow = ["crossterm", "futures-util", "interprocess", "libc", "sha2", "shepr-core", "time", "tokio", "tracing", "tracing-subscriber", "zbus"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-vt-layer"
from = "shepr-vt"
allow = ["alacritty_terminal", "serde", "shepr-core", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-pty-layer"
from = "shepr-pty"
allow = ["bytes", "libc", "shepr-core", "tokio", "tracing"]
kinds = ["normal"]

# `IsolatedEnv` isolates tests from `shepr_core::env`'s registry, so a
# variable added there is isolated with no change in this crate.
[[dependency_rule]]
name = "shepr-test-support-layer"
from = "shepr-test-support"
allow = ["shepr-core"]
kinds = ["normal"]

[[dependency_rule]]
name = "alacritty-terminal-only-in-shepr-vt"
from = "*"
forbid = "alacritty_terminal"
except = ["shepr-vt"]

[[dependency_rule]]
name = "shepr-agent-layer"
from = "shepr-agent"
allow = ["jsonc-parser", "libc", "regex", "serde", "serde_json", "shepr-core", "shepr-platform", "toml", "toml_edit", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-protocol-layer"
from = "shepr-protocol"
allow = ["ratatui", "serde", "shepr-core", "shepr-vt", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-config-layer"
from = "shepr-config"
allow = ["crossterm", "ratatui", "serde", "serde_ignored", "serde_json", "shepr-agent", "shepr-core", "time", "toml"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-api-layer"
from = "shepr-api"
allow = ["interprocess", "regex", "serde", "serde_json", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-vt", "tokio", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-termio-layer"
from = "shepr-termio"
allow = ["base64", "crossterm", "ratatui", "serde", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-vt", "tracing", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-remote-layer"
from = "shepr-remote"
allow = ["interprocess", "libc", "serde", "serde_json", "sha2", "shepr-api", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "tracing"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-client-layer"
from = "shepr-client"
allow = ["base64", "crossterm", "ctrlc", "interprocess", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-remote", "shepr-termio", "shepr-vt", "tokio", "toml", "tracing", "unicode-segmentation", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-mux-layer"
from = "shepr-mux"
allow = ["bytes", "crossterm", "ratatui", "regex", "serde", "serde_json", "sha2", "shepr-agent", "shepr-config", "shepr-core", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-termio", "shepr-vt", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]

[[dependency_rule]]
name = "shepr-server-layer"
from = "shepr-server"
allow = ["base64", "bytes", "crossterm", "ctrlc", "interprocess", "libc", "ratatui", "serde", "serde_json", "shepr-agent", "shepr-api", "shepr-config", "shepr-core", "shepr-mux", "shepr-platform", "shepr-protocol", "shepr-pty", "shepr-remote", "shepr-termio", "shepr-test-support", "shepr-vt", "time", "tokio", "tracing", "unicode-width"]
kinds = ["normal"]
